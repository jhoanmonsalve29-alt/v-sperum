<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vésperum | Moda & Tecnología Premium</title>
  <style>
    body { margin:0; font-family: 'Georgia', serif; background:#fff; color:#111; }
    header { padding:20px; text-align:center; border-bottom:1px solid #ddd; }
    header h1 { font-size:2.5rem; letter-spacing:4px; color:#006b4e; }
    nav { text-align:center; margin-top:10px; }
    nav a { margin:0 15px; text-decoration:none; color:#111; font-weight:bold; }
    nav a:hover { color:#006b4e; }
    .hero { text-align:center; padding:60px 20px; }
    .hero img { max-width:100%; height:auto; }
    .hero h2 { font-size:2rem; margin-top:20px; }
    .catalogo { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; padding:40px; }
    .producto { border:1px solid #eee; padding:20px; text-align:center; }
    .producto img { width:100%; height:300px; object-fit:cover; }
    .producto h3 { margin:15px 0 5px; font-size:1.2rem; }
    .producto p { color:#555; }
    footer { text-align:center; padding:20px; border-top:1px solid #ddd; font-size:.9rem; color:#555; }
  </style>
</head>
<body>

  <header>
    <h1>VÉSPERUM</h1>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#coleccion">Colección</a>
      <a href="#tienda">Tienda</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <section id="inicio" class="hero">
    <img src="https://images.unsplash.com/photo-1521334884684-d80222895322?q=80&w=1200" alt="Moda Premium">
    <h2>Elegancia y Tecnología en un solo lugar</h2>
  </section>

  <section id="coleccion" class="catalogo">
    <div class="producto">
      <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=600" alt="Auriculares">
      <h3>Auriculares Premium</h3>
      <p>$129.00</p>
    </div>
    <div class="producto">
      <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=600" alt="Teclado">
      <h3>Teclado Mecánico RGB</h3>
      <p>$85.50</p>
    </div>
    <div class="producto">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=600" alt="Laptop">
      <h3>Laptop Ultrabook</h3>
      <p>$899.00</p>
    </div>
  </section>

  <footer id="contacto">
    <p>© 2025 Vésperum - Inspirado en el estilo Gucci</p>
  </footer>

</body>
</html>
