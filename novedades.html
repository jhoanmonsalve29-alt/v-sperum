<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novedades — vésperum</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">vésperum</a>
    <nav class="nav">
      <a class="nav-item" href="catalogo.html">Catálogo</a>
      <a class="nav-item" href="novedades.html">Novedades</a>
      <a class="nav-item" href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="section-head">
      <h2>Novedades</h2>
    </section>
    <div id="newsGrid" class="news-grid"></div>
  </main>

  <footer class="footer">
    <div class="footbar">
      <small>© vésperum.</small>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script>
    const grid = document.getElementById('newsGrid');
    const items = window.VESPERUM.novedades;
    grid.innerHTML = items.map(n => `
      <article class="news-card">
        <div class="thumb"><img src="${n.thumb}" alt="${n.titulo}"></div>
        <div class="info">
          <div class="title">${n.titulo}</div>
          <small style="color:var(--muted)">${new Date(n.fecha).toLocaleDateString('es-VE')}</small>
          <p style="color:var(--muted)">${n.resumen}</p>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
